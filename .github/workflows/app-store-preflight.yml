name: App Store Preflight

on:
  workflow_dispatch:
    inputs:
      require_apple_sign_in:
        description: Fail when Sign in with Apple is not advertised by production
        required: true
        default: true
        type: boolean

jobs:
  preflight:
    name: Test, archive, and production smoke test
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: make generate

      - name: Run App Store preflight
        env:
          REQUIRE_APPLE_SIGN_IN: ${{ inputs.require_apple_sign_in && '1' || '0' }}
        run: ./scripts/app-store-preflight.sh
