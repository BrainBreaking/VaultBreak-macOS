name: VaultBreak
configs:
  Debug: debug
  Release: release
  ReleaseMAS: release
options:
  bundleIdPrefix: com.brainbreaking
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  VaultBreak:
    type: application
    platform: macOS
    sources:
      - VaultBreak
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brainbreaking.vaultbreak
        PRODUCT_NAME: VaultBreak
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: VaultBreak/Info.plist
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_CFBundleDisplayName: VaultBreak
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: VaultBreak/VaultBreak.entitlements
        ReleaseMAS:
          CODE_SIGN_ENTITLEMENTS: VaultBreak/VaultBreakMAS.entitlements
          ENABLE_APP_SANDBOX: YES
          ENABLE_HARDENED_RUNTIME: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"
  VaultBreakTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VaultBreakTests
        excludes:
          - ConsoleHandoffsViewModelTests.swift
    dependencies:
      - target: VaultBreak
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brainbreaking.vaultbreak.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VaultBreak.app/Contents/MacOS/VaultBreak"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  VaultBreak:
    build:
      targets:
        VaultBreak: all
        VaultBreakTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - VaultBreakTests
  VaultBreakMAS:
    build:
      targets:
        VaultBreak: all
    archive:
      config: ReleaseMAS
