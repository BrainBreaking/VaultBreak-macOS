<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141412"/>
      <stop offset="100%" stop-color="#0A0A08"/>
    </linearGradient>
  </defs>
  <!-- macOS-style rounded square -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="none" stroke="#F7F6F2" stroke-opacity="0.12" stroke-width="8"/>
  <!-- Shield -->
  <path d="M512 210
           C620 250 730 250 780 250
           C780 520 700 700 512 820
           C324 700 244 520 244 250
           C294 250 404 250 512 210 Z"
        fill="#F7F6F2"/>
  <!-- Inner shield accent notch -->
  <path d="M512 270
           C590 300 680 300 720 300
           C720 500 660 640 512 740
           C364 640 304 500 304 300
           C344 300 434 300 512 270 Z"
        fill="#0A0A08"/>
  <!-- Lock body -->
  <rect x="412" y="470" width="200" height="160" rx="28" fill="#D93B2D"/>
  <!-- Lock shackle -->
  <path d="M452 470 V410
           C452 360 476 330 512 330
           C548 330 572 360 572 410 V470"
        fill="none" stroke="#D93B2D" stroke-width="40" stroke-linecap="round"/>
  <!-- Keyhole -->
  <circle cx="512" cy="530" r="22" fill="#F7F6F2"/>
  <rect x="500" y="540" width="24" height="48" rx="8" fill="#F7F6F2"/>
</svg>
